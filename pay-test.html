<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test payment</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F8E3DE">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="img/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preload" href="fonts/lora-500-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/great-vibes-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="corner-lang" id="uiLang"></div>
<main class="stage">
  <section class="screen is-active">
    <div class="pay-box">
      <h1 class="script-title test-pay-title" data-t="testPayT"></h1>
      <p data-t="testPayText"></p>
      <ul class="card-marks" aria-hidden="true"><li>Uzcard</li><li>Humo</li><li>Visa</li><li>Mastercard</li></ul>
      <button class="btn" id="okBtn" type="button" data-t="testPayOk"></button>
      <button class="link-btn" id="cancelBtn" type="button" data-t="testPayCancel"></button>
      <p class="error" id="msg" role="status"></p>
    </div>
  </section>
</main>
<script type="module" src="js/pay-test.js"></script>
</body>
</html>
