<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cupidon — ask her out with a letter</title>
<meta name="description" content="Write a sealed letter, add three dishes and send her a link. She picks the dish and the day.">
<meta name="theme-color" content="#2A0E1F">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Infant:wght@600&family=Great+Vibes&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="demo-ribbon" id="demoRibbon" data-t="demoRibbon" hidden></div>

<header class="topbar">
  <a class="brand" href="#">Cupidon</a>
  <div class="topbar-right">
    <div id="uiLang"></div>
    <div class="user" id="userBox" hidden>
      <img id="userPhoto" alt="" referrerpolicy="no-referrer">
      <span id="userName"></span>
      <button class="link-btn" id="signOutBtn" type="button" data-t="signOut"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-loading"><p class="muted center" data-t="loadingApp"></p></section>

  <!-- Sign in -->
  <section class="view" id="view-login" hidden>
    <div class="hero">
      <div class="envelope" aria-hidden="true">
        <div class="env-back airmail"><i></i></div>
        <div class="env-letter"></div>
        <div class="env-pocket"><i></i></div>
        <div class="env-flap"><i></i></div>
        <span class="seal seal-static"><span>C</span></span>
      </div>
      <h1 class="hero-title" data-t="heroTitle"></h1>
      <p class="hero-sub" data-t="heroSub"></p>
      <button class="btn btn-light btn-google" id="signInBtn" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span id="signInLabel" data-t="signInGoogle"></span>
      </button>
      <p class="error" id="signInError" role="alert"></p>
      <p class="in-app-note" id="inAppNote" data-t="inAppBrowser" hidden></p>
    </div>
    <ol class="how">
      <li><h3 data-t="how1t"></h3><p data-t="how1p"></p></li>
      <li><h3 data-t="how2t"></h3><p data-t="how2p"></p></li>
      <li><h3 data-t="how3t"></h3><p data-t="how3p"></p></li>
    </ol>
  </section>

  <!-- His letters -->
  <section class="view" id="view-home" hidden>
    <div class="home-head">
      <h1 class="page-title" data-t="yourLetters"></h1>
      <a class="btn" href="#new" data-t="newLetter"></a>
    </div>
    <p class="error" id="homeError" role="alert"></p>
    <ul class="letters" id="letters"></ul>
    <div class="empty" id="lettersEmpty" hidden>
      <p data-t="empty"></p>
      <a class="btn" href="#new" data-t="writeLetter"></a>
    </div>
  </section>

  <!-- Write a letter -->
  <section class="view" id="view-create" hidden>
    <form class="sheet" id="createForm" novalidate>
      <h1 class="sheet-title" data-t="sheetTitle"></h1>
      <p class="sheet-lead" data-t="sheetLead"></p>

      <div class="part">
        <h2 data-t="letterLangT"></h2>
        <p class="help" data-t="letterLangH"></p>
        <div class="chips" id="langs" role="radiogroup" data-t-label="letterLangT"></div>
      </div>

      <div class="part">
        <h2 data-t="whoT"></h2>
        <p class="help" data-t="whoH"></p>
        <div class="fields">
          <label class="field"><span><span data-t="herName"></span></span>
            <input class="input" id="girlName" maxlength="30" autocomplete="off" placeholder="Sarvinoz">
            <p class="field-error" data-err="girlName"></p>
          </label>
          <label class="field"><span><span data-t="yourName"></span> <small data-t="yourNameNote"></small></span>
            <input class="input" id="fromName" maxlength="30" autocomplete="given-name" placeholder="Usmon">
            <p class="field-error" data-err="fromName"></p>
          </label>
        </div>
      </div>

      <div class="part">
        <h2 data-t="codeT"></h2>
        <p class="help" data-t="codeH"></p>
        <div class="fields">
          <div class="field"><span id="pinLabel" data-t="code"></span>
            <div class="pin" id="pin" role="group" aria-labelledby="pinLabel">
              <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="1">
              <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="2">
              <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="3">
              <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="4">
            </div>
            <p class="field-error" data-err="pin"></p>
          </div>
          <label class="field"><span><span data-t="hintL"></span> <small data-t="hintNote"></small></span>
            <input class="input" id="hint" maxlength="60" autocomplete="off" data-t-ph="hintPh">
          </label>
        </div>
      </div>

      <div class="part">
        <h2 data-t="styleT"></h2>
        <p class="help" data-t="styleH"></p>
        <div class="chips" id="styles" role="radiogroup" data-t-label="styleT"></div>
        <div class="letter-preview" id="preview" aria-live="polite"></div>
        <label class="field field-note"><span><span data-t="noteL"></span> <small data-t="noteNote"></small></span>
          <textarea class="input" id="note" maxlength="400" data-t-ph="notePh"></textarea>
        </label>
      </div>

      <div class="part">
        <h2 data-t="tripT"></h2>
        <p class="help" data-t="tripH"></p>
        <div class="choices">
          <label class="choice"><input type="radio" name="pickup" value="yes" checked><b data-t="pickupYes"></b><small data-t="pickupYesNote"></small></label>
          <label class="choice"><input type="radio" name="pickup" value="no"><b data-t="pickupNo"></b><small data-t="pickupNoNote"></small></label>
        </div>
      </div>

      <div class="part">
        <h2 data-t="dishesT"></h2>
        <p class="help" data-t="dishesH"></p>
        <div class="dish-grid" id="dishes"></div>
      </div>

      <div class="submit-row">
        <button class="btn" id="doneBtn" type="submit" data-t="done"></button>
        <p class="error" id="formError" role="alert"></p>
        <a class="link-btn link-cancel" href="#" data-t="cancel"></a>
      </div>
    </form>
  </section>

  <!-- Link ready -->
  <section class="view" id="view-done" hidden>
    <div class="done">
      <div class="envelope" aria-hidden="true">
        <div class="env-back airmail"><i></i></div>
        <div class="env-letter"></div>
        <div class="env-pocket"><i></i></div>
        <div class="env-flap"><i></i></div>
        <span class="seal seal-static"><span>♥</span></span>
      </div>
      <h1 class="done-title" data-t="sealed"></h1>
      <p id="doneText"></p>

      <div class="pay-box" id="payBox" hidden>
        <h2 data-t="payT"></h2>
        <p data-t="payText"></p>
        <ul class="card-marks" aria-label="Uzcard, Humo, Visa, Mastercard">
          <li>Uzcard</li><li>Humo</li><li>Visa</li><li>Mastercard</li>
        </ul>
        <button class="btn" id="payBtn" type="button"></button>
        <p class="error" id="payError" role="alert"></p>
        <button class="link-btn" id="checkPayBtn" type="button" data-t="checkAgain" hidden></button>
      </div>

      <div class="link-part" id="linkPart">
      <div class="linkbox">
        <label class="sr-only" for="doneLink" data-t="linkLabel"></label>
        <input id="doneLink" readonly>
        <button class="btn btn-small" id="copyBtn" type="button" data-t="copyLink"></button>
      </div>
      <div class="share-row">
        <a class="btn btn-ghost btn-small" id="shareTg" target="_blank" rel="noopener">Telegram</a>
        <a class="btn btn-ghost btn-small" id="shareWa" target="_blank" rel="noopener">WhatsApp</a>
        <button class="btn btn-ghost btn-small" id="shareMore" type="button" data-t="more" hidden></button>
      </div>
      <div class="code-note"><span data-t="codeIs"></span> <b id="donePin"></b><br><span data-t="codeNote"></span></div>
      <div class="share-row">
        <a class="btn btn-ghost btn-small" id="doneOpen" data-t="openLikeHer"></a>
      </div>
      </div>
      <a class="btn btn-ghost btn-small" href="#" data-t="backLetters"></a>
    </div>
  </section>
</main>

<script type="module" src="js/boy.js"></script>
</body>
</html>
